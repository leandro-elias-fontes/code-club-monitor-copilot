[project]
name = "code-monitor-copilot"
version = "3.0.0"
description = "Copiloto de bancada para instrutores e monitores de programacao competitiva (C/C++/Python)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
